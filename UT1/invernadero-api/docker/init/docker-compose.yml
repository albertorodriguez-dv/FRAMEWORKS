services:
  mariadb:
    image: mariadb:11
    container_name: invernadero-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
    ports:
      - '3306:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
 
volumes:
  mariadb-data: